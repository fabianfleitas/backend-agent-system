name: Deploy backend (GHCR)

# Publica la imagen del backend en GHCR. El despliegue al entorno final
# (Railway u otro) se hace desde la plataforma apuntando a esta imagen,
# o extendiendo este workflow con un paso de deploy al proveedor elegido.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'Dockerfile', 'docker-compose.yml', 'requirements.txt']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max